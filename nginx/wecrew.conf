# ==============================================================================
# WeCrew Technologies Private Limited
# Nginx Reverse Proxy with TLS Termination for wecrew.in
# ==============================================================================

upstream wecrew_app {
    server wecrew-web:80;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name wecrew.in www.wecrew.in;

    # ACME challenge for Let's Encrypt / Certbot certificate issuance & renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wecrew.in www.wecrew.in;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (2 years with subdomains and preload)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 10m;

    # Immutable build assets caching
    location /assets/ {
        proxy_pass http://wecrew_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Brand and icon assets caching
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        proxy_pass http://wecrew_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=2592000";
    }

    # SPA routing proxy
    location / {
        proxy_pass http://wecrew_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
