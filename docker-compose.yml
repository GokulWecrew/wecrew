services:
  wecrew-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: wecrew/web:latest
    container_name: wecrew-web
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - VITE_SITE_URL=https://wecrew.in
      - VITE_FORMSUBMIT_ENDPOINT=https://formsubmit.co/ajax/support@wecrew.in
      - VITE_FORMSUBMIT_EMAIL=support@wecrew.in
    env_file:
      - path: .env
        required: false

