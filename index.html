<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a1628" />

    <!-- Favicon & Brand Icons -->
    <link rel="icon" type="image/png" sizes="48x36" href="/icon.png" />
    <link rel="apple-touch-icon" sizes="180x135" href="/apple-icon.png" />

    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Pre-paint theme script: prevents flash of wrong theme -->
    <script>
      (function () {
        try {
          var k = "wecrew-theme";
          var t = localStorage.getItem(k) || "system";
          var d =
            t === "dark" ||
            (t === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var r = document.documentElement.classList;
          r.toggle("dark", d);
          document.documentElement.style.colorScheme = d ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
